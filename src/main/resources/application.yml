spring:
  application:
    name: flash-sale-platform

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale_db
    username: flashsale
    password: ChangeThisPassword123

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080